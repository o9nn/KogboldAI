# KoboldAI Kernel Release Build
# Builds pre-compiled binaries for all platforms and attaches to releases

name: Kernel Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.20.0)'
        required: true
        default: 'v1.20.0'

env:
  BUILD_TYPE: Release

jobs:
  build-linux-x64:
    name: Linux x86-64
    runs-on: ubuntu-20.04  # Use older Ubuntu for broader glibc compatibility

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Build kernel
      working-directory: kernel
      run: |
        mkdir -p build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
                 -DCMAKE_C_FLAGS="-static-libgcc" \
                 -DKOBOLD_KERNEL_BUILD_TESTS=OFF \
                 -DKOBOLD_KERNEL_BUILD_BENCHMARKS=OFF
        cmake --build . --config ${{ env.BUILD_TYPE }} -j$(nproc)

    - name: Run tests
      working-directory: kernel/build
      run: |
        # Quick sanity check
        ldd libkoboldkern.so || true

    - name: Package artifacts
      run: |
        mkdir -p dist/linux-x64
        cp kernel/build/libkoboldkern.so dist/linux-x64/
        cp kernel/build/libkoboldkern_static.a dist/linux-x64/
        cp kernel/include/kobold_kernel.h dist/linux-x64/
        cp kobold_kernel_ffi.py dist/linux-x64/
        echo "KoboldAI Kernel - Linux x86-64" > dist/linux-x64/README.txt
        echo "Copy libkoboldkern.so to kernel/build/ directory" >> dist/linux-x64/README.txt
        cd dist && tar -czvf kobold-kernel-linux-x64.tar.gz linux-x64/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: kobold-kernel-linux-x64
        path: dist/kobold-kernel-linux-x64.tar.gz

  build-linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Build for ARM64
      uses: uraimo/run-on-arch-action@v2
      with:
        arch: aarch64
        distro: ubuntu20.04
        run: |
          apt-get update
          apt-get install -y build-essential cmake
          cd kernel
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DKOBOLD_KERNEL_BUILD_TESTS=OFF \
                   -DKOBOLD_KERNEL_BUILD_BENCHMARKS=OFF
          cmake --build . -j$(nproc)

    - name: Package artifacts
      run: |
        mkdir -p dist/linux-arm64
        cp kernel/build/libkoboldkern.so dist/linux-arm64/
        cp kernel/build/libkoboldkern_static.a dist/linux-arm64/
        cp kernel/include/kobold_kernel.h dist/linux-arm64/
        cp kobold_kernel_ffi.py dist/linux-arm64/
        echo "KoboldAI Kernel - Linux ARM64" > dist/linux-arm64/README.txt
        cd dist && tar -czvf kobold-kernel-linux-arm64.tar.gz linux-arm64/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: kobold-kernel-linux-arm64
        path: dist/kobold-kernel-linux-arm64.tar.gz

  build-macos-arm64:
    name: macOS ARM64 (Apple Silicon)
    runs-on: macos-14  # M1 runner

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build kernel
      working-directory: kernel
      run: |
        mkdir -p build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
                 -DCMAKE_OSX_ARCHITECTURES=arm64 \
                 -DKOBOLD_KERNEL_BUILD_TESTS=OFF \
                 -DKOBOLD_KERNEL_BUILD_BENCHMARKS=OFF
        cmake --build . --config ${{ env.BUILD_TYPE }} -j$(sysctl -n hw.ncpu)

    - name: Package artifacts
      run: |
        mkdir -p dist/macos-arm64
        cp kernel/build/libkoboldkern.dylib dist/macos-arm64/
        cp kernel/build/libkoboldkern_static.a dist/macos-arm64/
        cp kernel/include/kobold_kernel.h dist/macos-arm64/
        cp kobold_kernel_ffi.py dist/macos-arm64/
        echo "KoboldAI Kernel - macOS ARM64 (Apple Silicon)" > dist/macos-arm64/README.txt
        cd dist && tar -czvf kobold-kernel-macos-arm64.tar.gz macos-arm64/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: kobold-kernel-macos-arm64
        path: dist/kobold-kernel-macos-arm64.tar.gz

  build-macos-x64:
    name: macOS x86-64 (Intel)
    runs-on: macos-13  # Intel runner

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build kernel
      working-directory: kernel
      run: |
        mkdir -p build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
                 -DCMAKE_OSX_ARCHITECTURES=x86_64 \
                 -DKOBOLD_KERNEL_BUILD_TESTS=OFF \
                 -DKOBOLD_KERNEL_BUILD_BENCHMARKS=OFF
        cmake --build . --config ${{ env.BUILD_TYPE }} -j$(sysctl -n hw.ncpu)

    - name: Package artifacts
      run: |
        mkdir -p dist/macos-x64
        cp kernel/build/libkoboldkern.dylib dist/macos-x64/
        cp kernel/build/libkoboldkern_static.a dist/macos-x64/
        cp kernel/include/kobold_kernel.h dist/macos-x64/
        cp kobold_kernel_ffi.py dist/macos-x64/
        echo "KoboldAI Kernel - macOS x86-64 (Intel)" > dist/macos-x64/README.txt
        cd dist && tar -czvf kobold-kernel-macos-x64.tar.gz macos-x64/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: kobold-kernel-macos-x64
        path: dist/kobold-kernel-macos-x64.tar.gz

  build-windows-x64:
    name: Windows x64
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Build kernel
      working-directory: kernel
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
                 -DKOBOLD_KERNEL_BUILD_TESTS=OFF `
                 -DKOBOLD_KERNEL_BUILD_BENCHMARKS=OFF
        cmake --build . --config ${{ env.BUILD_TYPE }}

    - name: Package artifacts
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path dist/windows-x64
        Copy-Item kernel/build/${{ env.BUILD_TYPE }}/koboldkern.dll dist/windows-x64/
        Copy-Item kernel/build/${{ env.BUILD_TYPE }}/koboldkern.lib dist/windows-x64/ -ErrorAction SilentlyContinue
        Copy-Item kernel/include/kobold_kernel.h dist/windows-x64/
        Copy-Item kobold_kernel_ffi.py dist/windows-x64/
        "KoboldAI Kernel - Windows x64`nCopy koboldkern.dll to kernel/build/Release/ directory" | Out-File dist/windows-x64/README.txt
        Compress-Archive -Path dist/windows-x64/* -DestinationPath dist/kobold-kernel-windows-x64.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: kobold-kernel-windows-x64
        path: dist/kobold-kernel-windows-x64.zip

  create-release-assets:
    name: Attach to Release
    runs-on: ubuntu-latest
    needs: [build-linux-x64, build-linux-arm64, build-macos-arm64, build-macos-x64, build-windows-x64]
    if: github.event_name == 'release'

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Upload release assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/kobold-kernel-linux-x64/kobold-kernel-linux-x64.tar.gz
          artifacts/kobold-kernel-linux-arm64/kobold-kernel-linux-arm64.tar.gz
          artifacts/kobold-kernel-macos-arm64/kobold-kernel-macos-arm64.tar.gz
          artifacts/kobold-kernel-macos-x64/kobold-kernel-macos-x64.tar.gz
          artifacts/kobold-kernel-windows-x64/kobold-kernel-windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-linux-x64, build-linux-arm64, build-macos-arm64, build-macos-x64, build-windows-x64]
    if: always()

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Print summary
      run: |
        echo "=== KoboldAI Kernel Release Build Summary ==="
        echo ""
        echo "Build Results:"
        echo "  Linux x64:    ${{ needs.build-linux-x64.result }}"
        echo "  Linux ARM64:  ${{ needs.build-linux-arm64.result }}"
        echo "  macOS ARM64:  ${{ needs.build-macos-arm64.result }}"
        echo "  macOS x64:    ${{ needs.build-macos-x64.result }}"
        echo "  Windows x64:  ${{ needs.build-windows-x64.result }}"
        echo ""
        echo "Artifacts:"
        find artifacts/ -type f -name "*.tar.gz" -o -name "*.zip" | while read f; do
          echo "  $(basename $f): $(du -h $f | cut -f1)"
        done
