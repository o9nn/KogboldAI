# KoboldAI Kernel CI/CD Pipeline
# Builds and tests the C kernel on multiple platforms

name: Kernel CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'kernel/**'
      - 'kobold_kernel_ffi.py'
      - 'test_python_ffi.py'
      - '.github/workflows/kernel-ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'kernel/**'
      - 'kobold_kernel_ffi.py'
      - 'test_python_ffi.py'
      - '.github/workflows/kernel-ci.yml'
  workflow_dispatch:  # Allow manual triggering

env:
  BUILD_TYPE: Release

jobs:
  build-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake python3 python3-pip

    - name: Configure CMake
      working-directory: kernel
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
                 -DKOBOLD_KERNEL_BUILD_TESTS=ON \
                 -DKOBOLD_KERNEL_BUILD_BENCHMARKS=ON

    - name: Build kernel
      working-directory: kernel/build
      run: cmake --build . --config ${{ env.BUILD_TYPE }} -j$(nproc)

    - name: Run unit tests
      working-directory: kernel/build
      run: |
        echo "=== Running Kernel Unit Tests ==="
        ./tests/test_kernel

    - name: Run benchmarks
      working-directory: kernel/build
      run: |
        echo "=== Running Kernel Benchmarks ==="
        ./tests/benchmark_kernel

    - name: Test Python FFI
      run: |
        echo "=== Testing Python FFI ==="
        python3 test_python_ffi.py

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-linux-x64
        path: |
          kernel/build/libkoboldkern.so
          kernel/build/libkoboldkern_static.a
        retention-days: 7

  build-macos:
    name: Build & Test (macOS)
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        brew install cmake

    - name: Configure CMake
      working-directory: kernel
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
                 -DKOBOLD_KERNEL_BUILD_TESTS=ON \
                 -DKOBOLD_KERNEL_BUILD_BENCHMARKS=ON

    - name: Build kernel
      working-directory: kernel/build
      run: cmake --build . --config ${{ env.BUILD_TYPE }} -j$(sysctl -n hw.ncpu)

    - name: Run unit tests
      working-directory: kernel/build
      run: |
        echo "=== Running Kernel Unit Tests ==="
        ./tests/test_kernel

    - name: Run benchmarks
      working-directory: kernel/build
      run: |
        echo "=== Running Kernel Benchmarks ==="
        ./tests/benchmark_kernel

    - name: Test Python FFI
      run: |
        echo "=== Testing Python FFI ==="
        python3 test_python_ffi.py

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-macos-arm64
        path: |
          kernel/build/libkoboldkern.dylib
          kernel/build/libkoboldkern_static.a
        retention-days: 7

  build-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Configure CMake
      working-directory: kernel
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
                 -DKOBOLD_KERNEL_BUILD_TESTS=ON `
                 -DKOBOLD_KERNEL_BUILD_BENCHMARKS=ON

    - name: Build kernel
      working-directory: kernel/build
      run: cmake --build . --config ${{ env.BUILD_TYPE }}

    - name: Run unit tests
      working-directory: kernel/build
      run: |
        echo "=== Running Kernel Unit Tests ==="
        .\${{ env.BUILD_TYPE }}\test_kernel.exe
      continue-on-error: true  # Windows paths may vary

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-windows-x64
        path: |
          kernel/build/${{ env.BUILD_TYPE }}/koboldkern.dll
          kernel/build/${{ env.BUILD_TYPE }}/koboldkern.lib
        retention-days: 7

  python-tests:
    name: Python Integration Tests
    runs-on: ubuntu-latest
    needs: build-linux

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Download kernel artifact
      uses: actions/download-artifact@v4
      with:
        name: kernel-linux-x64
        path: kernel/build/

    - name: Make library executable
      run: chmod +x kernel/build/libkoboldkern.so

    - name: Test Python FFI
      run: |
        echo "=== Testing Python FFI with Python ${{ matrix.python-version }} ==="
        python3 test_python_ffi.py

    - name: Run kobold_kernel_ffi module test
      run: |
        echo "=== Testing kobold_kernel_ffi module ==="
        python3 -c "import kobold_kernel_ffi as k; print(f'Available: {k.is_available()}')"

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install cppcheck
      run: sudo apt-get install -y cppcheck

    - name: Run cppcheck on kernel
      working-directory: kernel
      run: |
        cppcheck --enable=warning,style,performance \
                 --suppress=missingIncludeSystem \
                 --error-exitcode=0 \
                 -I include \
                 src/

    - name: Check Python code
      run: |
        pip install flake8
        flake8 kobold_kernel_ffi.py --max-line-length=120 --ignore=E501,W503 || true

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows, python-tests]
    if: always()

    steps:
    - name: Check results
      run: |
        echo "=== Kernel CI Summary ==="
        echo "Linux build: ${{ needs.build-linux.result }}"
        echo "macOS build: ${{ needs.build-macos.result }}"
        echo "Windows build: ${{ needs.build-windows.result }}"
        echo "Python tests: ${{ needs.python-tests.result }}"

        if [ "${{ needs.build-linux.result }}" = "failure" ]; then
          echo "::error::Linux build failed"
          exit 1
        fi
